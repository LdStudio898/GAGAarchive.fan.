    function getSongUrl(song) {
        return `songs/${encodeURIComponent(song.folder)}/${encodeURIComponent(song.fileName)}`;
    }

    let currentFilter = "all";
    let searchQuery = "";

    function openLyricsSidebar(song) {
        document.getElementById("sidebarTitle").innerText = song.title;
        document.getElementById("sidebarAlbum").innerText = `${song.album} (${song.year})`;
        document.getElementById("sidebarLyrics").innerHTML = song.lyrics.replace(/\n/g, '<br>');
        document.getElementById("lyricsSidebar").classList.add("open");
        document.getElementById("overlay").classList.add("active");
        document.getElementById("appWrapper").classList.add("with-sidebar");
    }

    function closeLyricsSidebar() {
        document.getElementById("lyricsSidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("active");
        document.getElementById("appWrapper").classList.remove("with-sidebar");
    }

    function renderSongs() {
        let filtered = [...songsDatabase];
        if (searchQuery.trim() !== "") {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(s => s.title.toLowerCase().includes(q) || s.lyrics.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
        }
        if (currentFilter === "az") filtered.sort((a,b) => a.title.localeCompare(b.title));
        else if (currentFilter === "album") filtered.sort((a,b) => a.album.localeCompare(b.album) || a.title.localeCompare(b.title));
        else filtered.sort((a,b) => a.id - b.id);

        const container = document.getElementById("songsContainer");
        if (!container) return;

        if (currentFilter === "album") {
            let byAlbum = {};
            filtered.forEach(song => { if (!byAlbum[song.album]) byAlbum[song.album] = []; byAlbum[song.album].push(song); });
            let html = "";
            for (let [album, songs] of Object.entries(byAlbum)) {
                html += `<div class="album-section" style="margin-top: 1.5rem;"><div class="album-title" style="font-size:0.9rem; margin-bottom:0.5rem; letter-spacing:2px;">${album}</div><div class="songs-grid">`;
                html += songs.map(s => renderSongCard(s)).join("");
                html += `</div></div>`;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = `<div class="songs-grid">${filtered.map(s => renderSongCard(s)).join("")}</div>`;
        }
        attachEvents();
    }

    function renderSongCard(song) {
        const preview = song.lyrics.substring(0, 80).replace(/\n/g, ' ') + (song.lyrics.length > 80 ? '…' : '');
        return `
            <div class="song-card" data-id="${song.id}">
                <div class="song-title">
                    ${song.title}
                    <span class="album-badge">${song.year}</span>
                </div>
                <div class="song-artist">${song.artist}</div>
                <div class="controls-card">
                    <button class="play-btn" data-id="${song.id}">▶ СЛУШАТЬ</button>
                    <button class="download-btn" data-id="${song.id}">⬇ СКАЧАТЬ</button>
                    <button class="lyrics-btn" data-id="${song.id}">📖 ТЕКСТ</button>
                </div>
                <div class="lyrics-preview">${preview}</div>
            </div>
        `;
    }

    function attachEvents() {
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) playSong(song);
            });
        });
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) await downloadSong(song);
            });
        });
        document.querySelectorAll('.lyrics-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
        document.querySelectorAll('.song-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const song = songsDatabase.find(s => s.id === parseInt(card.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
    }

    function playSong(song) {
        const audio = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");
        const playerArea = document.getElementById("playerArea");
        const playerPlaceholder = document.getElementById("playerPlaceholder");
        const url = getSongUrl(song);
        
        audio.src = url;
        audio.play().catch(() => {
            nowPlaying.innerHTML = `⚠️ Файл не найден: ${url}`;
        });
        nowPlaying.innerHTML = `▶ СЕЙЧАС ИГРАЕТ: ${song.title} — ${song.album} (${song.year})`;
        
        // ПОКАЗЫВАЕМ ПЛЕЕР, ПРЯЧЕМ ПЛЕЙСХОЛДЕР
        playerArea.classList.add("active");
        playerPlaceholder.style.display = "none";
    }

    async function downloadSong(song) {
        const url = getSongUrl(song);
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${song.title} - Lady Gaga.mp3`;
            a.click();
            URL.revokeObjectURL(a.href);
        } catch {
            alert(`Файл не найден: ${url}`);
        }
    }

    function updateAll() { renderSongs(); }

    // НАСТРОЙКА КНОПОК НАВИГАЦИИ
    document.getElementById("shopLink").addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/shop/collections/all", "_blank");
    });
    document.getElementById("projectsLink").addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://bornthisway.foundation/", "_blank");
    });
    document.getElementById("liveLink").addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/live", "_blank");
    });
    document.getElementById("musicLink").addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value;
        updateAll();
    });
    document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            updateAll();
        });
    });
    document.getElementById("closeSidebarBtn").addEventListener("click", closeLyricsSidebar);
    document.getElementById("overlay").addEventListener("click", closeLyricsSidebar);

    // ЗАПУСК
    initSlider();
    renderSongs();
</script>
