            padding: 0;

            padding: 0;
            margin: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);

            z-index: 0;
        }

        .app-wrapper {

        .songs-container {

        }

        .app-wrapper.with-sidebar .songs-container {
            padding-right: 420px;
        }

        .lyrics-sidebar {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100vh;

        .lyrics-sidebar.open {

        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #222;

        .sidebar-header h3 {

            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        .close-sidebar {

            color: #aaa;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .close-sidebar:hover {
            border-color: #fff;
            color: #fff;
        }

        .sidebar-song-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;

        }

        .sidebar-song-album {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 1.5rem;

            left: 0;

        }

            letter-spacing: 8px;

        }
        .logo span {
            font-weight: 300;
            color: #888;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-links a:hover {
            color: #ffffff;
        }

        /* МОБИЛЬНОЕ МЕНЮ */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: 1px solid #333;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .mobile-nav {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }
        .mobile-nav.open {
            display: flex;
        }
        .mobile-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 0.5rem;
        }

            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid #333;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
        }

        /* ДЕСКТОП СЛАЙДЕР */
        .slider-container {
            width: 100%;
            overflow: hidden;
            background: #000;
            margin-bottom: 1rem;
        }
        .slider-track {
            display: flex;
            animation: scroll 40s linear infinite;
            width: fit-content;
        }
        .slider-track img {
            height: 200px;
            width: auto;
            object-fit: cover;
            margin-right: 2px;
            filter: grayscale(0.3);
            transition: filter 0.3s;
        }
        .slider-track img:hover {
            filter: grayscale(0);
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* МОБИЛЬНЫЙ СЛАЙДЕР */
        .mobile-slideshow {
            display: none;
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #000;
            margin-bottom: 1rem;
        }
        .mobile-slideshow img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .mobile-slideshow img.active {
            opacity: 1;
        }

        }
        .filter-btn:hover {
            border-color: #fff;
            color: #fff;
        }

            border: 1px solid #222;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .album-badge {
            font-size: 0.55rem;
            color: #666;
            border: 1px solid #2a2a2a;
            padding: 3px 8px;
        }
        .song-artist {

            color: #555;
            margin: 8px 0 12px;
            text-transform: uppercase;
        }
        .controls-card {

            gap: 8px;

        button.play-btn:hover, button.download-btn:hover, button.lyrics-btn:hover {

            color: #000;
            border-color: #fff;
        }

        .player-area {
            margin: 2rem 2rem 0 2rem;
            background: #050505;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 1.2rem;
            position: sticky;
            bottom: 0;
            z-index: 10;
            display: none;
        }
        .player-area.active {

        }
        #nowPlaying {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

            filter: grayscale(1);
        }

            margin: 2rem 2rem 0 2rem;
            background: #050505;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 1.5rem;
            text-align: center;
            color: #444;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            text-align: center;
            margin: 2rem 2rem 0 2rem;
            padding: 1.5rem 0;
            color: #333;
            font-size: 0.6rem;

            }
            .songs-container {

</head>

        { id: 20, title: "Shadow Of A Man", album: "Mayhem", year: 2024, artist: "Lady Gaga", fileName: "Lady_Gaga_-_Shadow_Of_A_Man_79164848.mp3", folder: "Mayhem", lyrics: `[Chorus] I'll dance in the shadow of a man` },
        { id: 21, title: "Glamorous Life", album: "The Devil Versus Prada 2", year: 2024, artist: "Lady Gaga", fileName: "Lady_Gaga_-_Glamorous_Life_81412800.mp3", folder: "The Devil Versus Prada 2", lyrics: `[Chorus] I'll just crash 'til I die of the glamorous life` },
        { id: 22, title: "Shape Of A Woman", album: "The Devil Versus Prada 2", year: 2024, artist: "Lady Gaga", fileName: "Lady_Gaga_-_Shape_of_a_Woman_81412775.mp3", folder: "The Devil Versus Prada 2", lyrics: `[Chorus] Shape of a woman, see the violet in her eyes` },
        { id: 23, title: "Runway", album: "The Devil Versus Prada 2", year: 2024, artist: "Lady Gaga ft. Doechii", fileName: "Lady_Gaga_-_Runway_81248168.mp3", folder: "The Devil Versus Prada 2", lyrics: `[Chorus] I can turn a dance floor into a runway` }
    ];

    function getSongUrl(song) {
        return `songs/${encodeURIComponent(song.folder)}/${encodeURIComponent(song.fileName)}`;
    }

    let currentFilter = "all";
    let searchQuery = "";

    function openLyricsSidebar(song) {
        document.getElementById("sidebarTitle").innerText = song.title;
        document.getElementById("sidebarAlbum").innerText = `${song.album} (${song.year})`;
        document.getElementById("sidebarLyrics").innerHTML = song.lyrics.replace(/\n/g, '<br>');
        document.getElementById("lyricsSidebar").classList.add("open");
        document.getElementById("overlay").classList.add("active");
        document.getElementById("appWrapper").classList.add("with-sidebar");
    }

    function closeLyricsSidebar() {
        document.getElementById("lyricsSidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("active");
        document.getElementById("appWrapper").classList.remove("with-sidebar");
    }

    function renderSongs() {
        let filtered = [...songsDatabase];
        if (searchQuery.trim() !== "") {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(s => s.title.toLowerCase().includes(q) || s.lyrics.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
        }
        if (currentFilter === "az") filtered.sort((a,b) => a.title.localeCompare(b.title));
        else if (currentFilter === "album") filtered.sort((a,b) => a.album.localeCompare(b.album) || a.title.localeCompare(b.title));
        else filtered.sort((a,b) => a.id - b.id);

        const container = document.getElementById("songsContainer");
        if (!container) return;

        if (currentFilter === "album") {
            let byAlbum = {};
            filtered.forEach(song => { if (!byAlbum[song.album]) byAlbum[song.album] = []; byAlbum[song.album].push(song); });
            let html = "";
            for (let [album, songs] of Object.entries(byAlbum)) {
                html += `<div class="album-section" style="margin-top: 1.5rem;"><div class="album-title" style="font-size:0.9rem; margin-bottom:0.5rem; letter-spacing:2px;">${album}</div><div class="songs-grid">`;
                html += songs.map(s => renderSongCard(s)).join("");
                html += `</div></div>`;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = `<div class="songs-grid">${filtered.map(s => renderSongCard(s)).join("")}</div>`;
        }
        attachEvents();
    }

    function renderSongCard(song) {
        const preview = song.lyrics.substring(0, 80).replace(/\n/g, ' ') + (song.lyrics.length > 80 ? '…' : '');
        return `
            <div class="song-card" data-id="${song.id}">
                <div class="song-title">
                    ${song.title}
                    <span class="album-badge">${song.year}</span>
                </div>
                <div class="song-artist">${song.artist}</div>
                <div class="controls-card">
                    <button class="play-btn" data-id="${song.id}">▶ СЛУШАТЬ</button>
                    <button class="download-btn" data-id="${song.id}">⬇ СКАЧАТЬ</button>
                    <button class="lyrics-btn" data-id="${song.id}">📖 ТЕКСТ</button>
                </div>
                <div class="lyrics-preview">${preview}</div>
            </div>
        `;
    }

    function attachEvents() {
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) playSong(song);
            });
        });
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) await downloadSong(song);
            });
        });
        document.querySelectorAll('.lyrics-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
        document.querySelectorAll('.song-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const song = songsDatabase.find(s => s.id === parseInt(card.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
    }

    function playSong(song) {
        const audio = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");
        const playerArea = document.getElementById("playerArea");
        const playerPlaceholder = document.getElementById("playerPlaceholder");
        const url = getSongUrl(song);
        
        audio.src = url;
        audio.play().catch(() => {
            nowPlaying.innerHTML = `⚠️ Файл не найден: ${url}`;
        });
        nowPlaying.innerHTML = `▶ СЕЙЧАС ИГРАЕТ: ${song.title} — ${song.album} (${song.year})`;
        
        playerArea.classList.add("active");
        playerPlaceholder.style.display = "none";
    }

    async function downloadSong(song) {
        const url = getSongUrl(song);
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${song.title} - Lady Gaga.mp3`;
            a.click();
            URL.revokeObjectURL(a.href);
        } catch {
            alert(`Файл не найден: ${url}`);
        }
    }

    function updateAll() { renderSongs(); }

    // ЗАПУСК ВСЕГО ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ
    document.addEventListener("DOMContentLoaded", function() {
        initSlider();
        initMobileSlideshow();
        renderSongs();  // ← ЭТО ВАЖНО! Теперь песни появятся сразу
    });

    // НАСТРОЙКА КНОПОК НАВИГАЦИИ
    document.getElementById("shopLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/shop/collections/all", "_blank");
    });
    document.getElementById("mobileShopLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/shop/collections/all", "_blank");
        document.getElementById("mobileNav").classList.remove("open");
    });
    document.getElementById("projectsLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://bornthisway.foundation/", "_blank");
    });
    document.getElementById("mobileProjectsLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://bornthisway.foundation/", "_blank");
        document.getElementById("mobileNav").classList.remove("open");
    });
    document.getElementById("liveLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/live", "_blank");
    });
    document.getElementById("mobileLiveLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/live", "_blank");
        document.getElementById("mobileNav").classList.remove("open");
    });
    document.getElementById("musicLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("mobileMusicLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("mobileNav").classList.remove("open");
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // МОБИЛЬНОЕ МЕНЮ
    document.getElementById("mobileMenuToggle")?.addEventListener("click", () => {
        document.getElementById("mobileNav").classList.add("open");
    });
    document.getElementById("closeMobileMenu")?.addEventListener("click", () => {
        document.getElementById("mobileNav").classList.remove("open");
    });

    // ПОИСК (синхронизация)
    const searchInput = document.getElementById("searchInput");
    const mobileSearchInput = document.getElementById("mobileSearchInput");
    if (searchInput && mobileSearchInput) {
        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            mobileSearchInput.value = searchQuery;
            updateAll();
        });
        mobileSearchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            searchInput.value = searchQuery;
            updateAll();
        });
    }

    // ФИЛЬТРЫ
    const filterBtns = document.querySelectorAll("[data-filter]");
    const mobileFilterSelect = document.getElementById("mobileFilterSelect");
    
    filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            filterBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            if (mobileFilterSelect) mobileFilterSelect.value = currentFilter;
            updateAll();
        });
    });
    
    if (mobileFilterSelect) {
        mobileFilterSelect.addEventListener("change", (e) => {
            currentFilter = e.target.value;
            filterBtns.forEach(btn => {
                if (btn.dataset.filter === currentFilter) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
            updateAll();
        });
    }

    document.getElementById("closeSidebarBtn")?.addEventListener("click", closeLyricsSidebar);
    document.getElementById("overlay")?.addEventListener("click", closeLyricsSidebar);
</script>
</body>
</html>
