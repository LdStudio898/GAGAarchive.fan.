<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GAGA · Music Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Helvetica Neue', 'Arial', 'Segoe UI', sans-serif;
            color: #ffffff;
            padding: 0;
            margin: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        .app-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .songs-container {
            padding: 0 2rem 2rem 2rem;
            transition: all 0.3s ease;
        }

        .app-wrapper.with-sidebar .songs-container {
            padding-right: 420px;
        }

        .lyrics-sidebar {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: #0a0a0a;
            border-left: 1px solid #222;
            z-index: 100;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: -5px 0 30px rgba(0,0,0,0.8);
        }

        .lyrics-sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #222;
        }

        .sidebar-header h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        .close-sidebar {
            background: none;
            border: 1px solid #333;
            color: #aaa;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .close-sidebar:hover {
            border-color: #fff;
            color: #fff;
        }

        .sidebar-song-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .sidebar-song-album {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .sidebar-lyrics-content {
            font-family: monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            color: #ccc;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 99;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            color: #ffffff;
            text-decoration: none;
        }
        .logo span {
            font-weight: 300;
            color: #888;
        }

        .burger-menu {
            display: none;
            cursor: pointer;
            z-index: 200;
        }
        .burger-menu span {
            display: block;
            width: 25px;
            height: 2px;
            background: #fff;
            margin: 5px 0;
            transition: 0.3s;
        }
        .mobile-nav {
            position: fixed;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100vh;
            background: #0a0a0a;
            z-index: 150;
            padding: 5rem 2rem;
            transition: left 0.3s ease;
            border-right: 1px solid #222;
        }
        .mobile-nav.open {
            left: 0;
        }
        .mobile-nav a {
            display: block;
            color: #aaa;
            text-decoration: none;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 1rem 0;
            border-bottom: 1px solid #222;
        }
        .mobile-nav a:hover {
            color: #fff;
        }
        .close-mobile-nav {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: 1px solid #333;
            color: #aaa;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-links a:hover {
            color: #ffffff;
        }

        /* ПК СЛАЙДЕР */
        .slider-container {
            width: 100%;
            overflow: hidden;
            background: #000;
            margin-bottom: 1rem;
        }
        .slider-track {
            display: flex;
            animation: scroll 40s linear infinite;
            width: fit-content;
        }
        .slider-track img {
            height: 200px;
            width: auto;
            object-fit: cover;
            margin-right: 2px;
            filter: grayscale(0.3);
            transition: filter 0.3s;
        }
        .slider-track img:hover {
            filter: grayscale(0);
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* МОБИЛЬНЫЙ СЛАЙДЕР - ФОТО ВИДНО ПОЛНОСТЬЮ */
        .mobile-slider {
            display: none;
            width: 100%;
            position: relative;
            background: #000;
            margin-bottom: 1rem;
        }
        .mobile-slider img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            filter: grayscale(0.3);
            display: block;
        }

        .stats {
            color: #888;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 1.5rem 2rem 1rem 2rem;
            border-left: 2px solid #fff;
            padding-left: 1rem;
        }

        .controls {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 1rem 1.5rem;
            margin: 0 2rem 1.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            flex: 3;
            min-width: 200px;
        }
        .search-box input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            padding: 12px 20px;
            color: white;
            font-size: 0.8rem;
            font-family: monospace;
            outline: none;
        }
        .search-box input:focus {
            border-color: #fff;
        }
        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #333;
            padding: 8px 20px;
            color: #aaa;
            cursor: pointer;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .filter-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: #111;
            border: 1px solid #222;
        }

        .song-card {
            background: #0a0a0a;
            padding: 1.2rem;
            transition: 0.15s ease;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
        }
        .song-card:hover {
            background: #141414;
        }
        .song-title {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .album-badge {
            font-size: 0.55rem;
            color: #666;
            border: 1px solid #2a2a2a;
            padding: 3px 8px;
        }
        .song-artist {
            font-size: 0.65rem;
            color: #555;
            margin: 8px 0 12px;
            text-transform: uppercase;
        }
        .controls-card {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        button.play-btn, button.download-btn, button.lyrics-btn {
            background: transparent;
            border: 1px solid #333;
            padding: 5px 12px;
            color: #ccc;
            cursor: pointer;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.1s;
        }
        button.play-btn:hover, button.download-btn:hover, button.lyrics-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .lyrics-preview {
            font-size: 0.65rem;
            color: #555;
            margin-top: 10px;
            border-top: 1px solid #1a1a1a;
            padding-top: 8px;
            max-height: 60px;
            overflow-y: auto;
            line-height: 1.3;
        }

        .player-area {
            margin: 2rem 2rem 0 2rem;
            background: #050505;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 1.2rem;
            position: sticky;
            bottom: 0;
            z-index: 10;
            display: none;
        }
        .player-area.active {
            display: block;
        }
        #nowPlaying {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 0.5rem;
        }
        audio {
            width: 100%;
            filter: grayscale(1);
        }

        .player-placeholder {
            margin: 2rem 2rem 0 2rem;
            background: #050505;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 1.5rem;
            text-align: center;
            color: #444;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            margin: 2rem 2rem 0 2rem;
            padding: 1.5rem 0;
            color: #333;
            font-size: 0.6rem;
            text-transform: uppercase;
            border-top: 1px solid #111;
        }

        @media (max-width: 768px) {
            .songs-grid {
                grid-template-columns: 1fr;
            }
            .app-wrapper.with-sidebar .songs-container {
                padding-right: 0;
            }
            .lyrics-sidebar {
                width: 90%;
                right: -90%;
            }
            .site-header {
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem;
            }
            .nav-links {
                display: none;
            }
            .burger-menu {
                display: block;
            }
            .logo {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            .controls {
                flex-direction: column;
                margin: 0 1rem 1rem 1rem;
                padding: 1rem;
            }
            .filter-group {
                justify-content: center;
            }
            .search-box {
                width: 100%;
            }
            .stats {
                margin-left: 1rem;
                margin-right: 1rem;
                font-size: 0.55rem;
            }
            .player-area, .player-placeholder {
                margin: 1rem;
            }
            footer {
                margin: 1rem;
            }
            .songs-container {
                padding: 0 1rem 1rem 1rem;
            }
            .slider-container {
                display: none;
            }
            .mobile-slider {
                display: block;
            }
        }

        @media (max-width: 1000px) and (min-width: 769px) {
            .songs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .slider-track img {
                height: 120px;
            }
        }
    </style>
</head>

        for (let i = 0; i < 2; i++) {
            images.forEach(img => {
                const imgElement = document.createElement("img");
                imgElement.src = img;
                imgElement.alt = "Lady Gaga";
                imgElement.onerror = function() { this.style.display = "none"; };
                track.appendChild(imgElement);

        if (mobileSlideInterval) clearInterval(mobileSlideInterval);

            mobileSlideIndex = (mobileSlideIndex + 1) % images.length;
            const img = document.getElementById("mobileSlideImg");
            if (img && images[mobileSlideIndex]) {
                img.src = images[mobileSlideIndex];
            }
            // Случайная задержка от 3 до 7 секунд
            const delay = Math.floor(Math.random() * (7000 - 3000 + 1) + 3000);
            mobileSlideInterval = setTimeout(changeImage, delay);
        }
        
        // Первая смена через случайное время
        const firstDelay = Math.floor(Math.random() * (7000 - 3000 + 1) + 3000);
        mobileSlideInterval = setTimeout(changeImage, firstDelay);
    }

    function initMobileSlider() {
        const mobileImg = document.getElementById("mobileSlideImg");
        if (!mobileImg) return;
        if (images.length > 0) {
            mobileImg.src = images[0];
        }
        startMobileSlider();
    }

    function pauseMobileSlider() {
        if (mobileSlideInterval) clearInterval(mobileSlideInterval);
    }

    function resumeMobileSlider() {
        startMobileSlider();

    function getSongUrl(song) {
        return `songs/${encodeURIComponent(song.folder)}/${encodeURIComponent(song.fileName)}`;
    }

    let currentFilter = "all";
    let searchQuery = "";

    function openLyricsSidebar(song) {
        pauseMobileSlider();
        document.getElementById("sidebarTitle").innerText = song.title;
        document.getElementById("sidebarAlbum").innerText = `${song.album} (${song.year})`;
        document.getElementById("sidebarLyrics").innerHTML = song.lyrics.replace(/\n/g, '<br>');
        document.getElementById("lyricsSidebar").classList.add("open");
        document.getElementById("overlay").classList.add("active");
        document.getElementById("appWrapper").classList.add("with-sidebar");
    }

    function closeLyricsSidebar() {
        resumeMobileSlider();
        document.getElementById("lyricsSidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("active");
        document.getElementById("appWrapper").classList.remove("with-sidebar");
    }

    function renderSongs() {
        let filtered = [...songsDatabase];
        if (searchQuery.trim() !== "") {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(s => s.title.toLowerCase().includes(q) || s.lyrics.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
        }
        if (currentFilter === "az") filtered.sort((a,b) => a.title.localeCompare(b.title));
        else if (currentFilter === "album") filtered.sort((a,b) => a.album.localeCompare(b.album) || a.title.localeCompare(b.title));
        else filtered.sort((a,b) => a.id - b.id);

        const container = document.getElementById("songsContainer");
        if (!container) return;

        if (currentFilter === "album") {
            let byAlbum = {};
            filtered.forEach(song => { if (!byAlbum[song.album]) byAlbum[song.album] = []; byAlbum[song.album].push(song); });
            let html = "";
            for (let [album, songs] of Object.entries(byAlbum)) {
                html += `<div class="album-section" style="margin-top: 1.5rem;"><div class="album-title" style="font-size:0.9rem; margin-bottom:0.5rem; letter-spacing:2px;">${album}</div><div class="songs-grid">`;
                html += songs.map(s => renderSongCard(s)).join("");
                html += `</div></div>`;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = `<div class="songs-grid">${filtered.map(s => renderSongCard(s)).join("")}</div>`;
        }
        attachEvents();
    }

    function renderSongCard(song) {
        const preview = song.lyrics.substring(0, 80).replace(/\n/g, ' ') + (song.lyrics.length > 80 ? '…' : '');
        return `
            <div class="song-card" data-id="${song.id}">
                <div class="song-title">
                    ${song.title}
                    <span class="album-badge">${song.year}</span>
                </div>
                <div class="song-artist">${song.artist}</div>
                <div class="controls-card">
                    <button class="play-btn" data-id="${song.id}">▶ СЛУШАТЬ</button>
                    <button class="download-btn" data-id="${song.id}">⬇ СКАЧАТЬ</button>
                    <button class="lyrics-btn" data-id="${song.id}">📖 ТЕКСТ</button>
                </div>
                <div class="lyrics-preview">${preview}</div>
            </div>
        `;
    }

    function attachEvents() {
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) playSong(song);
            });
        });
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) await downloadSong(song);
            });
        });
        document.querySelectorAll('.lyrics-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const song = songsDatabase.find(s => s.id === parseInt(btn.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
        document.querySelectorAll('.song-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const song = songsDatabase.find(s => s.id === parseInt(card.dataset.id));
                if (song) openLyricsSidebar(song);
            });
        });
    }

    function playSong(song) {
        const audio = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");
        const playerArea = document.getElementById("playerArea");
        const playerPlaceholder = document.getElementById("playerPlaceholder");
        const url = getSongUrl(song);
        
        audio.src = url;
        audio.play().catch(() => {
            nowPlaying.innerHTML = `⚠️ Файл не найден: ${url}`;
        });
        nowPlaying.innerHTML = `▶ СЕЙЧАС ИГРАЕТ: ${song.title} — ${song.album} (${song.year})`;
        
        playerArea.classList.add("active");
        playerPlaceholder.style.display = "none";
    }

    async function downloadSong(song) {
        const url = getSongUrl(song);
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${song.title} - Lady Gaga.mp3`;
            a.click();
            URL.revokeObjectURL(a.href);
        } catch {
            alert(`Файл не найден: ${url}`);
        }
    }

    function updateAll() { renderSongs(); }

    // БУРГЕР-МЕНЮ
    function initMobileMenu() {
        const burger = document.getElementById("burgerMenu");
        const mobileNav = document.getElementById("mobileNav");
        const closeBtn = document.getElementById("closeMobileNav");
        const overlay = document.getElementById("overlay");
        
        if (burger) {
            burger.addEventListener("click", () => {
                mobileNav.classList.add("open");
                overlay.classList.add("active");
                pauseMobileSlider();
            });
        }
        if (closeBtn) {
            closeBtn.addEventListener("click", () => {
                mobileNav.classList.remove("open");
                overlay.classList.remove("active");
                resumeMobileSlider();
            });
        }
        overlay.addEventListener("click", () => {
            mobileNav.classList.remove("open");
            overlay.classList.remove("active");
            resumeMobileSlider();
        });
        
        document.getElementById("mobileMusicLink")?.addEventListener("click", (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: "smooth" });
            mobileNav.classList.remove("open");
            overlay.classList.remove("active");
        });
        document.getElementById("mobileShopLink")?.addEventListener("click", (e) => {
            e.preventDefault();
            window.open("https://www.ladygaga.com/us-en/shop/collections/all", "_blank");
            mobileNav.classList.remove("open");
            overlay.classList.remove("active");
        });
        document.getElementById("mobileProjectsLink")?.addEventListener("click", (e) => {
            e.preventDefault();
            window.open("https://bornthisway.foundation/", "_blank");
            mobileNav.classList.remove("open");
            overlay.classList.remove("active");
        });
        document.getElementById("mobileLiveLink")?.addEventListener("click", (e) => {
            e.preventDefault();
            window.open("https://www.ladygaga.com/us-en/live", "_blank");
            mobileNav.classList.remove("open");
            overlay.classList.remove("active");
        });
    }

    // ПК КНОПКИ
    document.getElementById("shopLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/shop/collections/all", "_blank");
    });
    document.getElementById("projectsLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://bornthisway.foundation/", "_blank");
    });
    document.getElementById("liveLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://www.ladygaga.com/us-en/live", "_blank");
    });
    document.getElementById("musicLink")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("searchInput")?.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        updateAll();
    });
    document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            updateAll();
        });
    });
    document.getElementById("closeSidebarBtn")?.addEventListener("click", closeLyricsSidebar);
    document.getElementById("overlay")?.addEventListener("click", closeLyricsSidebar);

    initSlider();
    initMobileSlider();
    initMobileMenu();
    renderSongs();
</script>
</body>
</html>
